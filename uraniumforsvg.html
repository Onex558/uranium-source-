<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#00ff88">
<title>Uranium Games</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:"Segoe UI",Tahoma,Geneva,Verdana,sans-serif;
    background:#0a0e1a;
    min-height:100vh;
    color:#fff;
    overflow-x:hidden;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
        radial-gradient(circle at 20% 50%,rgba(0,255,136,.10),transparent 50%),
        radial-gradient(circle at 80% 80%,rgba(57,255,20,.10),transparent 50%),
        radial-gradient(circle at 40% 20%,rgba(0,255,136,.05),transparent 40%);
    pointer-events:none;
    z-index:0;
}

.container{
    max-width:1400px;
    margin:auto;
    padding:20px;
    position:relative;
    z-index:1;
}

header{
    text-align:center;
    padding:50px 20px;
    background:rgba(10,20,30,.82);
    backdrop-filter:blur(10px);
    border-radius:20px;
    margin-bottom:35px;
    border:1px solid rgba(0,255,136,.3);
    box-shadow:
        0 0 40px rgba(0,255,136,.3),
        inset 0 0 60px rgba(0,255,136,.08),
        0 8px 32px rgba(0,0,0,.5);
    position:relative;
    overflow:hidden;
    animation:slideDown .6s ease-out;
}

header::before{
    content:"☢️";
    position:absolute;
    font-size:15em;
    opacity:.04;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    animation:rotate 20s linear infinite;
}

@keyframes rotate{
    from{transform:translate(-50%,-50%) rotate(0deg)}
    to{transform:translate(-50%,-50%) rotate(360deg)}
}

@keyframes slideDown{
    from{
        opacity:0;
        transform:translateY(-30px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

h1{
    font-size:clamp(2.5rem,7vw,4em);
    margin-bottom:10px;
    background:linear-gradient(to right,#00ff88,#39ff14,#00ff88);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    background-clip:text;
    text-shadow:
        0 0 10px rgba(0,255,136,.8),
        0 0 20px rgba(0,255,136,.5);
    position:relative;
    z-index:1;
    font-weight:900;
    letter-spacing:3px;
}

.tagline{
    font-size:1.05em;
    color:#00ff88;
    opacity:.9;
    position:relative;
    z-index:1;
}

.status-line{
    margin-top:14px;
    font-size:.8em;
    letter-spacing:2px;
    color:rgba(0,255,136,.75);
    position:relative;
    z-index:1;
}

.search-bar{
    display:flex;
    justify-content:center;
    margin:30px 0;
}

.search-bar input{
    width:600px;
    max-width:95vw;
    padding:15px 25px;
    font-size:1.05em;
    border:2px solid rgba(0,255,136,.4);
    border-radius:50px;
    background:rgba(10,20,30,.95);
    color:#00ff88;
    box-shadow:0 0 20px rgba(0,255,136,.15);
    transition:.3s;
}

.search-bar input::placeholder{
    color:rgba(0,255,136,.5);
}

.search-bar input:focus{
    outline:none;
    border-color:#00ff88;
    box-shadow:0 0 30px rgba(0,255,136,.4);
}

.filter-bar{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-bottom:20px;
    flex-wrap:wrap;
}

.filter-btn{
    background:rgba(10,20,30,.9);
    border:2px solid rgba(0,255,136,.3);
    color:rgba(0,255,136,.75);
    padding:9px 20px;
    border-radius:30px;
    font-weight:600;
    cursor:pointer;
    transition:.25s;
}

.filter-btn:hover{
    border-color:#00ff88;
    color:#00ff88;
    box-shadow:0 0 15px rgba(0,255,136,.3);
}

.filter-btn.active{
    background:#00ff88;
    color:#000;
    border-color:#00ff88;
    box-shadow:0 0 20px rgba(0,255,136,.6);
}

.game-count{
    color:#00ff88;
    text-shadow:0 0 8px rgba(0,255,136,.6);
    margin-bottom:10px;
    font-weight:600;
    text-align:right;
    padding-right:10px;
}

.games-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
    gap:25px;
    margin-top:25px;
}

@media(max-width:900px){
    .games-grid{
        grid-template-columns:repeat(3,1fr);
    }
}

@media(max-width:650px){
    .games-grid{
        grid-template-columns:repeat(2,1fr);
        gap:15px;
    }
}

@media(max-width:430px){
    .games-grid{
        grid-template-columns:1fr 1fr;
    }
}

.game-card{
    background:rgba(10,20,30,.85);
    backdrop-filter:blur(10px);
    border-radius:18px;
    overflow:hidden;
    cursor:pointer;
    transition:.35s;
    border:1px solid rgba(0,255,136,.25);
    box-shadow:
        0 0 18px rgba(0,255,136,.15),
        0 8px 25px rgba(0,0,0,.45);
    color:inherit;
    text-decoration:none;
    display:block;
    width:100%;
    animation:fadeInUp .4s ease both;
}

.game-card:hover{
    transform:translateY(-8px) scale(1.02);
    border-color:#00ff88;
    box-shadow:
        0 0 35px rgba(0,255,136,.45),
        0 15px 35px rgba(0,0,0,.5);
}

.game-image{
    width:100%;
    aspect-ratio:1/1;
    background:
        radial-gradient(circle,#003d29,#001a0f);
    position:relative;
    overflow:hidden;
}

.game-image img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.fallback{
    position:absolute;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:8px;
    color:#00ff88;
    text-align:center;
    padding:10px;
    font-size:2.5em;
}

.fallback span{
    font-size:.3em;
    letter-spacing:1px;
}

.game-source-tag{
    position:absolute;
    top:8px;
    left:8px;
    background:rgba(0,0,0,.75);
    border:1px solid rgba(0,255,136,.5);
    color:#00ff88;
    font-size:.6em;
    padding:4px 8px;
    border-radius:20px;
    z-index:2;
}

.game-info{
    padding:15px;
}

.game-title{
    font-size:1.05em;
    font-weight:700;
    margin-bottom:5px;
    color:#00ff88;
    text-shadow:0 0 8px rgba(0,255,136,.45);
}

.game-author{
    font-size:.7em;
    color:rgba(0,255,136,.55);
    letter-spacing:.5px;
}

.loading-state{
    grid-column:1/-1;
    text-align:center;
    padding:60px 20px;
    color:rgba(0,255,136,.75);
}

.spinner{
    width:40px;
    height:40px;
    border:3px solid rgba(0,255,136,.2);
    border-top-color:#00ff88;
    border-radius:50%;
    margin:0 auto 16px;
    animation:spin .8s linear infinite;
}

@keyframes spin{
    to{transform:rotate(360deg)}
}

@keyframes fadeInUp{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* MODAL */

#gameModal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.94);
    z-index:99999;
    align-items:center;
    justify-content:center;
    flex-direction:column;
}

#gameFrame{
    width:92%;
    height:86%;
    border:none;
    border-radius:15px;
    background:#000;
    box-shadow:0 0 35px rgba(0,255,136,.5);
}

#closeBtn{
    position:absolute;
    top:20px;
    right:25px;
    background:#00ff88;
    color:#000;
    font-weight:bold;
    font-size:1em;
    padding:10px 20px;
    border:none;
    border-radius:30px;
    cursor:pointer;
    box-shadow:0 0 20px rgba(0,255,136,.5);
    z-index:2;
}

#closeBtn:hover{
    background:#39ff14;
}

#openExternalBtn{
    position:absolute;
    bottom:20px;
    right:25px;
    background:#07150f;
    color:#00ff88;
    border:1px solid #00ff88;
    padding:10px 18px;
    border-radius:25px;
    cursor:pointer;
    z-index:2;
}

#modalError{
    display:none;
    flex-direction:column;
    align-items:center;
    gap:14px;
    text-align:center;
    max-width:450px;
    padding:30px;
}

#modalError .icon{
    font-size:3em;
}

#modalErrorTitle{
    font-size:1.3em;
    font-weight:700;
}

#modalErrorReason{
    color:rgba(255,255,255,.6);
    font-size:.9em;
}

.particle{
    position:fixed;
    width:3px;
    height:3px;
    background:#00ff88;
    border-radius:50%;
    box-shadow:0 0 10px #00ff88;
    pointer-events:none;
    z-index:0;
    animation:float 15s infinite ease-in-out;
}

.p1{top:20%;left:10%}
.p2{top:40%;left:30%;animation-delay:2s}
.p3{top:60%;left:70%;animation-delay:4s}
.p4{top:80%;left:50%;animation-delay:1s}
.p5{top:15%;left:85%;animation-delay:3s}

@keyframes float{
    0%,100%{
        transform:translate(0,0);
        opacity:0;
    }
    10%,90%{
        opacity:1;
    }
    50%{
        transform:translate(50px,-100px);
    }
}
</style>
</head>

<div id="gameCount" class="game-count">

</div>

<div class="games-grid" id="gamesGrid">
    <div class="loading-state">
        <div class="spinner"></div>
        Loading game libraries…
    </div>
</div>

</div>

<div id="gameModal">

    <button id="closeBtn">
        ✕ Close
    </button>

    <button id="openExternalBtn">
        ↗ Open
    </button>

    <iframe
        id="gameFrame"
        allowfullscreen
        allow="fullscreen; autoplay; gamepad; pointer-lock"

    ></iframe>

    <div id="modalError">

        <div class="icon">⚠️</div>

        <div id="modalErrorTitle"></div>

        <div id="modalErrorReason"></div>

    </div>

</div>

/* =========================================================
   HELPER FUNCTIONS
   ========================================================= */

function escapeHTML(value){
    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


function getEmojiCover(value){

    if(!value || !value.startsWith("emoji:")){
        return null;
    }

    return value.substring(6);
}


/* =========================================================
   RENDER
   ========================================================= */

function renderGames(list){

    gameCountEl.textContent =
        `${list.length} ${list.length === 1 ? "Game" : "Games"}`;

    gamesGrid.innerHTML = "";

    if(!list.length){

        gamesGrid.innerHTML = `
            <div class="loading-state">
                🔎<br><br>
                No games match your search.
            </div>
        `;

        return;
    }

    const frag = document.createDocumentFragment();

    list.forEach((game,index)=>{

        const card = document.createElement("a");

        card.href = "#";
        card.className = "game-card";
        card.style.animationDelay =
            `${Math.min(index,25)*.025}s`;

        const emoji = getEmojiCover(game.resolvedCover);

        let imageHTML;

        if(emoji){

            imageHTML = `
                <div class="fallback"
                     style="display:flex">
                    ${emoji}
                    <span>${escapeHTML(game.name)}</span>
                </div>
            `;

        }else{

            imageHTML = `
                <img
                    src="${escapeHTML(game.resolvedCover || "")}"
                    alt="${escapeHTML(game.name)}"
                    loading="lazy"
                    onerror="
                        this.style.display='none';
                        this.parentElement.querySelector('.fallback').style.display='flex';
                    "
                >

                <div class="fallback">
                    🎮
                    <span>${escapeHTML(game.name)}</span>
                </div>
            `;
        }

        card.innerHTML = `
            <div class="game-image">

                <div class="game-source-tag">
                    ${escapeHTML(game.sourceName || "Custom")}
                </div>

                ${imageHTML}

            </div>

            <div class="game-info">

                <div class="game-title">
                    ${escapeHTML(game.name)}
                </div>

                <div class="game-author">
                    ${escapeHTML(game.author || "Unknown")}
                </div>

            </div>
        `;

        card.addEventListener("click",(event)=>{

            event.preventDefault();

            openGame(game);

        });

        frag.appendChild(card);

    });

    gamesGrid.appendChild(frag);
}


/* =========================================================
   FILTERS
   ========================================================= */

function buildFilters(){

    const sources = [
        ...new Set(
            allGames
                .map(game=>game.sourceName)
                .filter(Boolean)
        )
    ];

    filterBar.innerHTML = `
        <button
            class="filter-btn active"
            data-source="all">
            All Games
        </button>
    `;

    sources.forEach(source=>{

        const button =
            document.createElement("button");

        button.className = "filter-btn";

        button.dataset.source = source;

        button.textContent = source;

        filterBar.appendChild(button);

    });
}


function handleSearch(){

    const query =
        searchInput.value
            .toLowerCase()
            .trim();

    let results =
        currentFilter === "all"
        ? allGames
        : allGames.filter(
            game =>
                game.sourceName === currentFilter
        );

    if(query){

        const tokens =
            query.split(/\s+/);

        results = results.filter(game=>{

            const target = `
                ${game.name}
                ${game.author || ""}
                ${game.sourceName || ""}
            `.toLowerCase();

            return tokens.every(
                token=>target.includes(token)
            );

        });
    }

    renderGames(results);
}


/* =========================================================
   SEARCH
   ========================================================= */

let searchTimer;

searchInput.addEventListener("input",()=>{

    clearTimeout(searchTimer);

    searchTimer = setTimeout(
        handleSearch,
        100
    );

});


filterBar.addEventListener("click",(event)=>{

    const button =
        event.target.closest(".filter-btn");

    if(!button) return;

    document
        .querySelectorAll(".filter-btn")
        .forEach(btn =>
            btn.classList.remove("active")
        );

    button.classList.add("active");

    currentFilter =
        button.dataset.source;

    handleSearch();

});


/* =========================================================
   CACHE
   ========================================================= */

function loadCache(){

    try{

        const cached =
            localStorage.getItem(
                "uraniumGamesCache"
            );

        if(!cached) return;

        const parsed =
            JSON.parse(cached);

        if(!Array.isArray(parsed)) return;

        allGames = parsed;

        buildFilters();

        renderGames(allGames);

        statusLine.textContent =
            `Showing ${allGames.length} cached games`;

    }catch(error){

        console.warn(
            "Uranium cache error:",
            error
        );

        localStorage.removeItem(
            "uraniumGamesCache"
        );
    }
}


/* =========================================================
   LOAD GAMES
   ========================================================= */

function loadAllGames(){

    statusLine.textContent =
        "Loading game library…";

    /*
     * IMPORTANT:
     * We intentionally start with customGames.
     * Your original sources array was empty.
     */

    allGames = [...customGames];

    /*
     * Remove duplicate entries.
     */

    const unique = [];
    const seen = new Set();

    for(const game of allGames){

        if(!game || !game.name || !game.resolvedUrl){
            continue;
        }

        const key =
            `${game.name}|${game.resolvedUrl}`;

        if(seen.has(key)){
            continue;
        }

        seen.add(key);

        unique.push(game);

    }

    allGames = unique;

    try{

        localStorage.setItem(
            "uraniumGamesCache",
            JSON.stringify(allGames)
        );

    }catch(error){

        console.warn(
            "Could not save Uranium cache:",
            error
        );

    }

    buildFilters();

    renderGames(allGames);

    statusLine.textContent =
        `${allGames.length} games loaded`;

}


/* =========================================================
   MODAL
   ========================================================= */

function showModalError(name,reason){

    gameFrame.style.display = "none";

    modalError.style.display = "flex";

    document
        .getElementById("modalErrorTitle")
        .textContent =
        `${name} failed to load`;

    document
        .getElementById("modalErrorReason")
        .textContent =
        reason;

}


function hideModalError(){

    modalError.style.display = "none";

    gameFrame.style.display = "block";

}


/* =========================================================
   OPEN GAME
   ========================================================= */

function openGame(game){

    if(!game || !game.resolvedUrl){
        return;
    }

    currentGameUrl =
        game.resolvedUrl;

    gameModal.style.display =
        "flex";

    gameFrame.style.display =
        "block";

    hideModalError();

    gameFrame.src =
        game.resolvedUrl;

}


/* =========================================================
   EXTERNAL OPEN
   ========================================================= */

openExternalBtn.addEventListener(
    "click",
    ()=>{
        if(!currentGameUrl) return;

        window.open(
            currentGameUrl,
            "_blank",
            "noopener,noreferrer"
        );
    }
);


/* =========================================================
   CLOSE
   ========================================================= */

function closeModal(){

    gameModal.style.display =
        "none";

    gameFrame.src =
        "about:blank";

    hideModalError();

    currentGameUrl = "";

    if(currentBlobUrl){

        URL.revokeObjectURL(
            currentBlobUrl
        );

        currentBlobUrl = null;

    }

}


document
    .getElementById("closeBtn")
    .addEventListener(
        "click",
        closeModal
    );


gameModal.addEventListener(
    "click",
    event=>{

        if(event.target === gameModal){
            closeModal();
        }

    }
);


document.addEventListener(
    "keydown",
    event=>{

        if(
            event.key === "Escape" &&
            gameModal.style.display === "flex"
        ){

            closeModal();

        }

    }
);


/* =========================================================
   START
   ========================================================= */

window.addEventListener(
    "load",
    ()=>{
        loadCache();
        loadAllGames();
    }
);

</script>
