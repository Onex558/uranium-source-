<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoundDrive Upload Studio</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #0f0f0f;
            color: #fff;
            padding-bottom: 120px;
        }
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: #141414;
            border-bottom: 1px solid #222;
            padding: 16px 5%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #1db954;
            white-space: nowrap;
        }
        .search-bar {
            flex: 1;
            max-width: 500px;
        }
        .search-bar input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 30px;
            border: 1px solid #333;
            background: #202020;
            color: white;
            outline: none;
            font-size: 14px;
        }
        .search-bar input:focus {
            border-color: #1db954;
        }
        .upload-btn {
            background: #1db954;
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
        }
        .upload-btn:hover {
            background: #1ed760;
        }
        .filters-container {
            padding: 20px 5%;
            display: flex;
            gap: 10px;
            overflow-x: auto;
        }
        .filter-btn {
            background: #202020;
            border: 1px solid #333;
            color: #ccc;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            white-space: nowrap;
            font-size: 13px;
        }
        .filter-btn:hover, .filter-btn.active {
            background: #1db954;
            color: #000;
            border-color: #1db954;
        }
        .container {
            padding: 0 5%;
        }
        .section-title {
            font-size: 18px;
            margin-bottom: 15px;
            color: #aaa;
        }
        .music-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
        }
        .track-card {
            background: #181818;
            border: 1px solid #252525;
            border-radius: 10px;
            padding: 14px;
            cursor: pointer;
            transition: 0.2s;
        }
        .track-card:hover {
            background: #222;
            border-color: #1db954;
            transform: translateY(-4px);
        }
        .track-art {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 6px;
            background: #282828;
            margin-bottom: 10px;
        }
        .track-name {
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .track-artist, .track-album {
            color: #888;
            font-size: 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .player-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #121212;
            border-top: 1px solid #282828;
            padding: 15px 5%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            z-index: 1000;
        }
        .now-playing {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 300px;
        }
        .np-art {
            width: 50px;
            height: 50px;
            border-radius: 4px;
            object-fit: cover;
            background: #252525;
        }
        .np-info .np-title {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 3px;
        }
        .np-info .np-artist {
            font-size: 12px;
            color: #888;
        }
        .player-controls {
            flex: 1;
            max-width: 600px;
        }
        audio {
            width: 100%;
            outline: none;
        }
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }
        .modal-content {
            background: #1a1a1a;
            padding: 30px;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            border: 1px solid #333;
        }
        .modal-content h3 {
            margin-bottom: 20px;
            color: #1db954;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            font-size: 12px;
            color: #aaa;
            margin-bottom: 5px;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            background: #111;
            border: 1px solid #333;
            color: white;
            border-radius: 6px;
        }
        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }
        .modal-actions button {
            padding: 8px 16px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-cancel {
            background: #333;
            color: white;
        }
        .btn-submit {
            background: #1db954;
            color: black;
        }
        .empty-state {
            text-align: center;
            color: #666;
            padding: 40px;
            grid-column: 1 / -1;
            display: none;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">🎵 SoundDrive</div>
        <div class="search-bar">
            <input id="searchInput" type="text" placeholder="Search by song, artist, or album..." oninput="renderMusic()">
        </div>
        <button class="upload-btn" onclick="openModal()">+ Add Music</button>
    </header>

    <div class="filters-container" id="filtersContainer"></div>

    <main class="container">
        <h2 class="section-title">My Uploaded Music Library</h2>
        <div class="music-grid" id="musicGrid"></div>
        <div class="empty-state" id="emptyState">No tracks uploaded yet. Click "+ Add Music" to add your downloads!</div>
    </main>

    <div class="player-bar" id="playerBar">
        <div class="now-playing">
            <img id="npArt" class="np-art" src="https://placehold.co/100x100/222/1db954?text=♪" alt="Art">
            <div class="np-info">
                <div id="npTitle" class="np-title">Select a track</div>
                <div id="npArtist" class="np-artist">-</div>
            </div>
        </div>
        <div class="player-controls">
            <audio id="audioPlayer" controls></audio>
        </div>
    </div>

    <!-- Upload Modal -->
    <div class="modal" id="uploadModal">
        <div class="modal-content">
            <h3>Upload Music File</h3>
            <div class="form-group">
                <label>Music File (MP3/WAV)</label>
                <input type="file" id="fileInput" accept="audio/*">
            </div>
            <div class="form-group">
                <label>Song Title</label>
                <input type="text" id="titleInput" placeholder="e.g. Starboy">
            </div>
            <div class="form-group">
                <label>Artist Name</label>
                <input type="text" id="artistInput" placeholder="e.g. The Weeknd">
            </div>
            <div class="form-group">
                <label>Album Name</label>
                <input type="text" id="albumInput" placeholder="e.g. Starboy Album">
            </div>
            <div class="form-group">
                <label>Cover Image URL (Optional)</label>
                <input type="text" id="coverInput" placeholder="Paste image link here">
            </div>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeModal()">Cancel</button>
                <button class="btn-submit" onclick="handleUpload()">Upload Song</button>
            </div>
        </div>
    </div>

    <script>
        let tracks = [];
        let currentFilter = "All";

        function openModal() {
            document.getElementById("uploadModal").style.display = "flex";
        }

        function closeModal() {
            document.getElementById("uploadModal").style.display = "none";
            document.getElementById("fileInput").value = "";
            document.getElementById("titleInput").value = "";
            document.getElementById("artistInput").value = "";
            document.getElementById("albumInput").value = "";
            document.getElementById("coverInput").value = "";
        }

        function handleUpload() {
            const fileInput = document.getElementById("fileInput");
            const titleInput = document.getElementById("titleInput").value.trim();
            const artistInput = document.getElementById("artistInput").value.trim();
            const albumInput = document.getElementById("albumInput").value.trim();
            const coverInput = document.getElementById("coverInput").value.trim();

            if (fileInput.files.length === 0) {
                alert("Please select an audio file.");
                return;
            }

            const file = fileInput.files[0];
            const fileURL = URL.createObjectURL(file);

            const newTrack = {
                title: titleInput || file.name.replace(/\.[^/.]+$/, ""),
                artist: artistInput || "Unknown Artist",
                album: albumInput || "Single",
                url: fileURL,
                cover: coverInput || ""
            };

            tracks.push(newTrack);
            closeModal();
            renderFilters();
            renderMusic();
        }

        function getFilterList() {
            const artists = [...new Set(tracks.map(t => t.artist))];
            const albums = [...new Set(tracks.map(t => t.album))];
            return ["All", ...artists, ...albums];
        }

        function renderFilters() {
            const container = document.getElementById("filtersContainer");
            const filters = getFilterList();
            container.innerHTML = "";

            filters.forEach(filter => {
                const btn = document.createElement("button");
                btn.className = "filter-btn" + (filter === currentFilter ? " active" : "");
                btn.textContent = filter;
                btn.onclick = () => {
                    currentFilter = filter;
                    renderFilters();
                    renderMusic();
                };
                container.appendChild(btn);
            });
        }

        function renderMusic() {
            const grid = document.getElementById("musicGrid");
            const empty = document.getElementById("emptyState");
            const searchQuery = document.getElementById("searchInput").value.toLowerCase().trim();
            
            grid.innerHTML = "";

            const filteredTracks = tracks.filter(track => {
                const matchesSearch = track.title.toLowerCase().includes(searchQuery) ||
                                      track.artist.toLowerCase().includes(searchQuery) ||
                                      track.album.toLowerCase().includes(searchQuery);
                
                const matchesFilter = currentFilter === "All" || 
                                      track.artist === currentFilter || 
                                      track.album === currentFilter;

                return matchesSearch && matchesFilter;
            });

            if (filteredTracks.length === 0) {
                empty.style.display = "block";
                return;
            }

            empty.style.display = "none";

            filteredTracks.forEach(track => {
                const card = document.createElement("div");
                card.className = "track-card";
                card.onclick = () => playTrack(track);
                card.innerHTML = `
                    <img class="track-art" src="${track.cover}" alt="${escapeHTML(track.title)}" onerror="this.src='https://placehold.co/300x300/181818/1db954?text=♪'">
                    <div class="track-name" title="${escapeHTML(track.title)}">${escapeHTML(track.title)}</div>
                    <div class="track-artist">${escapeHTML(track.artist)}</div>
                    <div class="track-album">${escapeHTML(track.album)}</div>
                `;
                grid.appendChild(card);
            });
        }

        function playTrack(track) {
            const player = document.getElementById("audioPlayer");
            document.getElementById("npTitle").textContent = track.title;
            document.getElementById("npArtist").textContent = track.artist;
            document.getElementById("npArt").src = track.cover || "https://placehold.co/100x100/222/1db954?text=♪";
            
            player.src = track.url;
            player.play();
        }

        function escapeHTML(text) {
            const div = document.createElement("div");
            div.textContent = text;
            return div.innerHTML;
        }

        renderFilters();
        renderMusic();
    </script>
</body>
</html>
