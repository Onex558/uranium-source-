<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <base href="https://cdn.jsdelivr.net/gh/Onex558/potesss@main/s-macke.github.io/FSHistory/">

  <title>Microsoft Flight Simulator</title>

  <script src="bzip2.js"></script>
  <script src="dos.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #screen {
      width: 100%;
      height: 100%;
      display: block;
    }

    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font: 32px Arial, sans-serif;
      background: black;
      z-index: 9999;
    }
  </style>
</head>

<body onload="startGame()">

<div id="loading">Loading Microsoft Flight Simulator...</div>

<canvas id="screen" width="640" height="480"></canvas>

<script>
function startGame() {
    if (typeof Main === "function") {
        Main(4);
    }

    document.getElementById("loading").style.display = "none";
}
</script>
<!-- Controls Button -->
<button id="controlsBtn">✈️ Controls</button>

<!-- Controls Popup -->
<div id="controlsPopup">
    <div class="controlsBox">
        <h2>Microsoft Flight Simulator Controls</h2>

        <table>
            <tr><td>↑ ↓ ← →</td><td>Steering</td></tr>
            <tr><td>F1</td><td>Throttle Down</td></tr>
            <tr><td>F4</td><td>Throttle Up</td></tr>
            <tr><td>F5</td><td>Flaps Down</td></tr>
            <tr><td>F8</td><td>Flaps Up</td></tr>
            <tr><td>G</td><td>Landing Gear</td></tr>
            <tr><td>S</td><td>Change View</td></tr>
            <tr><td>A</td><td>Option A</td></tr>
            <tr><td>B</td><td>Option B</td></tr>
            <tr><td>C</td><td>Option C</td></tr>
        </table>

        <br>
        <button onclick="closeControls()">Close</button>
    </div>
</div>

<style>
#controlsBtn{
    position:fixed;
    top:15px;
    right:15px;
    z-index:9999;
    background:#1c6ea4;
    color:white;
    border:none;
    border-radius:8px;
    padding:10px 16px;
    font-size:16px;
    cursor:pointer;
    box-shadow:0 4px 10px rgba(0,0,0,.4);
}

#controlsBtn:hover{
    background:#2487c7;
}

#controlsPopup{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.65);
    z-index:10000;
    justify-content:center;
    align-items:center;
}

.controlsBox{
    background:#202020;
    color:white;
    border:2px solid #1c6ea4;
    border-radius:12px;
    padding:25px;
    width:350px;
    max-width:90%;
    font-family:Arial,sans-serif;
    box-shadow:0 10px 30px rgba(0,0,0,.5);
}

.controlsBox h2{
    margin-top:0;
    text-align:center;
    color:#f0d895;
}

.controlsBox table{
    width:100%;
    border-collapse:collapse;
}

.controlsBox td{
    padding:6px;
    border-bottom:1px solid #444;
}

.controlsBox button{
    width:100%;
    padding:10px;
    font-size:16px;
    cursor:pointer;
}
</style>

<script>
const controlsBtn = document.getElementById("controlsBtn");
const controlsPopup = document.getElementById("controlsPopup");

controlsBtn.onclick = () => {
    controlsPopup.style.display = "flex";
};

function closeControls(){
    controlsPopup.style.display = "none";
}

controlsPopup.addEventListener("click", function(e){
    if(e.target === controlsPopup){
        closeControls();
    }
});
</script>
</body>
</html>
