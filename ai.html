<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Chat</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --border: #243042;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --accent: #3b82f6;
      --user: #1d4ed8;
      --assistant: #1f2937;
      --input: #0b1220;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(180deg, #0f172a 0%, #111827 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .container {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding: 16px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    header {
      background: rgba(17, 24, 39, 0.9);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 24px;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      margin-top: 12px;
    }

    .controls input,
    .controls select {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--input);
      color: var(--text);
      outline: none;
    }

    .controls input::placeholder {
      color: #6b7280;
    }

    .btn {
      border: none;
      border-radius: 12px;
      padding: 12px 16px;
      cursor: pointer;
      background: var(--accent);
      color: white;
      font-weight: 700;
    }

    .btn:hover { filter: brightness(1.05); }
    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .chat {
      flex: 1;
      background: rgba(17, 24, 39, 0.88);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      overflow-y: auto;
      min-height: 420px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .msg {
      max-width: 85%;
      padding: 12px 14px;
      border-radius: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-wrap: break-word;
      border: 1px solid transparent;
    }

    .user {
      align-self: flex-end;
      background: rgba(29, 78, 216, 0.25);
      border-color: rgba(59, 130, 246, 0.35);
    }

    .assistant {
      align-self: flex-start;
      background: rgba(31, 41, 55, 0.95);
      border-color: var(--border);
    }

    .error {
      align-self: flex-start;
      background: rgba(127, 29, 29, 0.7);
      border-color: rgba(239, 68, 68, 0.4);
      color: #fecaca;
    }

    .composer {
      background: rgba(17, 24, 39, 0.9);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
    }

    .composer textarea {
      width: 100%;
      resize: none;
      min-height: 52px;
      max-height: 180px;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--input);
      color: var(--text);
      outline: none;
      font-family: inherit;
      line-height: 1.4;
    }

    .status {
      color: var(--muted);
      font-size: 13px;
      margin-top: -4px;
      min-height: 18px;
    }

    .footer {
      color: var(--muted);
      font-size: 12px;
      text-align: center;
      padding-bottom: 12px;
    }

    @media (max-width: 640px) {
      .controls,
      .composer {
        grid-template-columns: 1fr;
      }
      .msg { max-width: 95%; }
      h1 { font-size: 20px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>AI Chat</h1>
      <p class="subtitle">
        Type a message and chat with the model. Add your API key below.
      </p>

      <div class="controls">
        <input id="apiKey" type="password" placeholder="Paste your OpenAI API key here" autocomplete="off" />
        <select id="model">
          <option value="gpt-4o-mini" selected>gpt-4o-mini</option>
          <option value="gpt-4.1-mini">gpt-4.1-mini</option>
        </select>
      </div>
    </header>

    <div id="chat" class="chat" aria-live="polite"></div>

    <div class="status" id="status"></div>

    <div class="composer">
      <textarea id="message" placeholder="Type your message..."></textarea>
      <button class="btn" id="sendBtn">Send</button>
    </div>

    <div class="footer">
      For GitHub Pages: this is a front-end demo. Do not expose a real API key on a public site.
    </div>
  </div>

  <script>
    const chatEl = document.getElementById('chat');
    const messageEl = document.getElementById('message');
    const apiKeyEl = document.getElementById('apiKey');
    const modelEl = document.getElementById('model');
    const sendBtn = document.getElementById('sendBtn');
    const statusEl = document.getElementById('status');

    const messages = [
      {
        role: 'system',
        content: 'You are a helpful AI assistant.'
      }
    ];

    function addMessage(text, className) {
      const div = document.createElement('div');
      div.className = `msg ${className}`;
      div.textContent = text;
      chatEl.appendChild(div);
      chatEl.scrollTop = chatEl.scrollHeight;
      return div;
    }

    function setStatus(text) {
      statusEl.textContent = text || '';
    }

    function getApiKey() {
      return apiKeyEl.value.trim();
    }

    async function sendMessage() {
      const apiKey = getApiKey();
      const userText = messageEl.value.trim();

      if (!apiKey) {
        setStatus('Please add your OpenAI API key.');
        return;
      }

      if (!userText) {
        setStatus('Type a message first.');
        return;
      }

      setStatus('');
      addMessage(userText, 'user');
      messages.push({ role: 'user', content: userText });
      messageEl.value = '';

      sendBtn.disabled = true;
      messageEl.disabled = true;
      setStatus('Thinking...');

      try {
        const response = await fetch('https://api.openai.com/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${apiKey}`
          },
          body: JSON.stringify({
            model: modelEl.value,
            messages: messages,
            temperature: 0.7
          })
        });

        const data = await response.json();

        if (!response.ok) {
          const errorMsg = data?.error?.message || `Request failed with status ${response.status}`;
          throw new Error(errorMsg);
        }

        const reply = data?.choices?.[0]?.message?.content || 'No response received.';
        messages.push({ role: 'assistant', content: reply });
        addMessage(reply, 'assistant');
        setStatus('');
      } catch (err) {
        console.error(err);
        addMessage(`Error: ${err.message}`, 'error');
        setStatus('');
      } finally {
        sendBtn.disabled = false;
        messageEl.disabled = false;
        messageEl.focus();
      }
    }

    sendBtn.addEventListener('click', sendMessage);

    messageEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    addMessage('Hello! Add your API key and send a message.', 'assistant');
  </script>
</body>
</html>
